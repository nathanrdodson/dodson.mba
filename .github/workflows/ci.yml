name: CI

# Merging to `main` deploys straight to production with no staging environment,
# so this is the only gate a change passes through before it is live.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint Markdown
        run: npm run lint:md

      # The real correctness gate: content frontmatter is validated against the
      # Zod schemas in src/content.config.ts at build time.
      - name: Build
        run: npm run build
